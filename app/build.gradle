plugins { id 'com.android.application' }

android {
    namespace 'com.abdulrhman.xo3d'
    compileSdk 36

    defaultConfig {
        applicationId 'com.abdulrhman.xo3d'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug { applicationIdSuffix '.debug' }
        release {
            minifyEnabled false
            shrinkResources false
            def ks = System.getenv('KEYSTORE_PATH')
            def kp = System.getenv('KEYSTORE_PASSWORD')
            def ka = System.getenv('KEY_ALIAS')
            def kpass = System.getenv('KEY_PASSWORD')
            if (ks?.trim() && kp?.trim() && ka?.trim() && kpass?.trim() && new File(ks).exists()) {
                signingConfig signingConfigs.create('ciRelease') {
                    storeFile file(ks)
                    storePassword kp
                    keyAlias ka
                    keyPassword kpass
                }
            }
        }
    }

    packaging { resources.excludes += ['/META-INF/{AL2.0,LGPL2.1}'] }
}
