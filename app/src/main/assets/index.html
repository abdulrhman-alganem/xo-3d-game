<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#070a16"><title>XO 3D</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Tahoma,Arial,sans-serif;color:#fff;background:radial-gradient(circle at 15% 12%,#183b55 0,transparent 27%),radial-gradient(circle at 85% 82%,#4b183c 0,transparent 29%),linear-gradient(145deg,#050711,#11162d 55%,#070914);touch-action:manipulation}.hidden{display:none!important}.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px}.card{width:min(520px,100%);text-align:center;padding:25px 18px 20px;border:1px solid #ffffff22;border-radius:30px;background:#ffffff12;backdrop-filter:blur(20px);box-shadow:0 30px 80px #0000007a}.logo{font-size:clamp(58px,17vw,92px);font-weight:1000;letter-spacing:7px;margin:0;text-shadow:0 0 35px #5ee7ff38}.logo span:first-child{color:#5ee7ff}.logo span:last-child{color:#ff6bb5}.tag{color:#aeb7d5;margin:2px 0 26px;font-size:14px}.menu{display:grid;gap:12px}.bigbtn,.action,.iconbtn{border:1px solid #ffffff26;color:#fff;background:#ffffff12;cursor:pointer}.bigbtn{border-radius:18px;padding:16px 14px;box-shadow:inset 0 1px #ffffff1a,0 7px 0 #0000004d;font-weight:800}.bigbtn:active{transform:translateY(3px)}.primary{background:linear-gradient(135deg,#5ee7ff40,#ff6bb533)}.small{font-size:12px;color:#8e98ba;margin-top:18px}.game{position:absolute;inset:0;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.iconbtn{width:44px;height:44px;border-radius:14px;font-size:20px}.mode{font-weight:900;font-size:15px}.turn{color:#aeb7d5;font-size:12px;margin-top:2px}.scorebar{display:flex;justify-content:center;gap:7px;margin:12px auto 9px;width:min(410px,100%)}.scorebox{flex:1;max-width:125px;text-align:center;border:1px solid #ffffff1a;background:#0000002e;border-radius:15px;padding:8px 4px}.scorebox b{display:block;font-size:21px}.sx{color:#5ee7ff}.so{color:#ff6bb5}.status{height:34px;text-align:center;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center}.board-area{flex:1;display:flex;align-items:center;justify-content:center;perspective:1000px;min-height:0}.board{width:min(88vw,430px);height:min(88vw,430px);max-width:430px;max-height:430px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:11px;padding:11px;border-radius:27px;transform:rotateX(7deg);background:linear-gradient(145deg,#242b51,#0b1027);border:1px solid #ffffff1f;box-shadow:0 17px 0 #050711,0 32px 55px #00000080,inset 0 2px #ffffff1a}.cell{box-sizing:border-box;width:100%;height:100%;min-width:0;min-height:0;padding:0;margin:0;border:0;border-radius:18px;background:linear-gradient(145deg,#1d264b,#090e24);box-shadow:inset 0 3px 7px #ffffff12,inset 0 -10px 15px #0006,0 7px 0 #050711;color:#fff;font-size:clamp(58px,19vw,94px);font-weight:1000;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;transform:none!important}.cell:active{transform:none!important;filter:brightness(1.18)}.x{color:#5ee7ff;text-shadow:0 0 28px #5ee7ffb8,0 7px 0 #00648259}.o{color:#ff6bb5;text-shadow:0 0 28px #ff6bb5ad,0 7px 0 #82145066}.win{animation:glow .65s infinite alternate;filter:brightness(1.45)}@keyframes glow{to{box-shadow:inset 0 3px 12px #ffffff29,inset 0 -10px 15px #0006,0 7px 0 #050711,0 0 28px #ffffff59}}.bottom{display:flex;gap:8px;justify-content:center;padding-top:14px}.action{flex:1;max-width:190px;padding:12px;border-radius:15px;font-weight:800}.footer{text-align:center;color:#747e9e;font-size:10px;padding:9px 0 2px}.winOverlay{position:fixed;inset:0;background:#02040eb0;backdrop-filter:blur(7px);display:flex;align-items:center;justify-content:center;z-index:20;animation:fade .25s forwards}.winModal{width:min(88vw,390px);padding:28px 20px;text-align:center;border:1px solid #ffffff2e;border-radius:28px;background:linear-gradient(145deg,#1f284df5,#080c1ff7);box-shadow:0 30px 90px #000a,0 0 50px #5ee7ff24}.winIcon{font-size:64px;line-height:1;animation:pop .45s}.winTitle{font-size:29px;font-weight:1000;margin:4px}.winSub{font-size:13px;color:#aeb7d5;margin:8px 0 20px}.winButtons{display:flex;gap:9px}.winButtons button{flex:1;padding:13px;border:0;border-radius:15px;color:#fff;font-weight:900;background:#ffffff1a}.winButtons .again{background:linear-gradient(135deg,#168da8,#b83d7d)}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}.piece{position:absolute;width:8px;height:14px;background:#5ee7ff;animation:fall 1.3s linear forwards}.piece:nth-child(3n){background:#ff6bb5}.piece:nth-child(3n+1){background:#fff}@keyframes fall{from{transform:translateY(-20px) rotate(0)}to{transform:translateY(105vh) rotate(720deg)}}@media(max-height:650px){.board{width:min(70vh,390px);height:min(70vh,390px);max-width:390px;max-height:390px}.scorebar{margin:5px auto}.status{height:27px}.bottom{padding-top:7px}}</style></head><body><div id="home" class="screen"><div class="card"><div class="logo"><span>X</span><span>O</span></div><div class="tag">3D Tic-Tac-Toe • نسخة الموبايل</div><div class="menu"><button class="bigbtn primary" onclick="start('ai')">🤖 العب ضد الكمبيوتر</button><button class="bigbtn" onclick="start('pvp')">👥 شخص ضد شخص</button></div><div class="small">اختر وضع اللعب ثم استمتع بالجولة 🎮</div></div></div><div id="game" class="game hidden"><div class="top"><button class="iconbtn" onclick="goHome()">⌂</button><div style="text-align:center"><div id="modeTitle" class="mode">ضد الكمبيوتر</div><div id="turnText" class="turn">أنت X</div></div><button class="iconbtn" onclick="newGame()">↻</button></div><div class="scorebar"><div class="scorebox"><span class="sx">X</span><b id="xs">0</b></div><div class="scorebox"><span>تعادل</span><b id="ds">0</b></div><div class="scorebox"><span class="so">O</span><b id="os">0</b></div></div><div id="status" class="status">دورك — أنت X</div><div class="board-area"><div id="board" class="board"></div></div><div class="bottom"><button class="action" onclick="newGame()">🎮 جولة جديدة</button><button id="diffBtn" class="action" onclick="cycleDifficulty()">🧠 متوسط</button></div><div class="footer">تعمل بدون إنترنت</div></div><div id="confetti"></div><script>let board=Array(9).fill(''),mode='ai',over=false,difficulty='medium',score={X:0,O:0,D:0},audioCtx=null;const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]],levels=['easy','medium','hard'],names={easy:'سهل',medium:'متوسط',hard:'صعب'};function audio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}function tone(f,d,t='sine',v=.045,z=0){let a=audio(),o=a.createOscillator(),g=a.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(0,a.currentTime+z);g.gain.linearRampToValueAtTime(v,a.currentTime+z+.015);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+z+d);o.connect(g);g.connect(a.destination);o.start(a.currentTime+z);o.stop(a.currentTime+z+d+.03)}function moveSound(p){tone(p==='X'?520:330,.09,'triangle',.035);tone(p==='X'?760:490,.08,'sine',.022,.055)}function winSound(){tone(523,.16,'sine',.06);tone(659,.16,'sine',.06,.12);tone(784,.24,'sine',.07,.24);tone(1047,.38,'sine',.075,.4)}function drawSound(){tone(260,.14,'triangle',.045);tone(210,.2,'triangle',.04,.13)}function start(m){mode=m;home.classList.add('hidden');game.classList.remove('hidden');diffBtn.style.display=m==='ai'?'block':'none';modeTitle.textContent=m==='ai'?'🤖 ضد الكمبيوتر':'👥 شخص ضد شخص';audio();newGame()}function goHome(){game.classList.add('hidden');home.classList.remove('hidden');closeResult()}function newGame(){closeResult();board=Array(9).fill('');over=false;render();status.textContent=mode==='ai'?'دورك — أنت X':'دور X';turnText.textContent=mode==='ai'?'أنت X':'اللاعب X يبدأ'}function render(){boardEl();updateScore()}function boardEl(){let e=document.getElementById('board');e.innerHTML='';board.forEach((v,i)=>{let b=document.createElement('button');b.type='button';b.className='cell'+(v?' '+v.toLowerCase():'');b.textContent=v;b.onclick=()=>move(i);e.appendChild(b)})}function updateScore(){xs.textContent=score.X;os.textContent=score.O;ds.textContent=score.D}function check(b=board){for(let l of wins){let[a,c,d]=l;if(b[a]&&b[a]===b[c]&&b[a]===b[d])return{winner:b[a],line:l}}if(b.every(Boolean))return{winner:'D',line:[]};return null}function move(i){if(over||board[i])return;let p=mode==='ai'?'X':(board.filter(Boolean).length%2===0?'X':'O');board[i]=p;moveSound(p);render();if(finish())return;if(mode==='ai'){status.textContent='🤖 الكمبيوتر يفكر...';turnText.textContent='دور الكمبيوتر O';setTimeout(aiMove,300)}else{let n=p==='X'?'O':'X';status.textContent='دور '+n;turnText.textContent='اللاعب '+n}}function aiMove(){if(over)return;let i=choose();if(i>=0)board[i]='O';moveSound('O');render();if(finish())return;status.textContent='دورك — أنت X';turnText.textContent='أنت X'}function empty(){return board.map((v,i)=>v?null:i).filter(i=>i!==null)}function tactical(p){for(let i of empty()){board[i]=p;let r=check();board[i]='';if(r&&r.winner===p)return i}return-1}function choose(){let e=empty();if(!e.length)return-1;if(difficulty==='easy')return e[Math.floor(Math.random()*e.length)];let w=tactical('O');if(w>=0)return w;let bl=tactical('X');if(bl>=0)return bl;if(difficulty==='medium'){if(!board[4])return 4;let c=[0,2,6,8].filter(i=>!board[i]);if(c.length)return c[Math.floor(Math.random()*c.length)];return e[Math.floor(Math.random()*e.length)]}let best=-Infinity,bi=e[0];for(let i of e){board[i]='O';let s=minimax(false);board[i]='';if(s>best){best=s;bi=i}}return bi}function minimax(max){let r=check();if(r)return r.winner==='O'?10:r.winner==='X'?-10:0;let e=empty();if(max){let b=-Infinity;for(let i of e){board[i]='O';b=Math.max(b,minimax(false));board[i]=''}return b}let b=Infinity;for(let i of e){board[i]='X';b=Math.min(b,minimax(true));board[i]=''}return b}function finish(){let r=check();if(!r)return false;over=true;if(r.winner==='D'){score.D++;status.textContent='🤝 تعادل!';turnText.textContent='انتهت الجولة';drawSound()}else{score[r.winner]++;r.line.forEach(i=>document.getElementById('board').children[i].classList.add('win'));status.textContent=mode==='ai'?(r.winner==='X'?'🎉 فزت!':'🤖 الكمبيوتر فاز!'):'🎉 اللاعب '+r.winner+' فاز!';turnText.textContent='انتهت الجولة';winSound();celebrate()}updateScore();setTimeout(()=>showResult(r),180);return true}function celebrate(){let c=document.getElementById('confetti');for(let i=0;i<65;i++){let p=document.createElement('i');p.className='piece';p.style.left=Math.random()*100+'%';p.style.animationDelay=Math.random()*.45+'s';c.appendChild(p);setTimeout(()=>p.remove(),1900)}}function showResult(r){closeResult();let title=r.winner==='D'?'تعادل!':mode==='ai'?(r.winner==='X'?'أنت الفائز!':'الكمبيوتر فاز!'):'اللاعب '+r.winner+' فاز!',icon=r.winner==='D'?'🤝':'🏆';let o=document.createElement('div');o.id='winOverlay';o.className='winOverlay';o.innerHTML='<div class="winModal"><div class="winIcon">'+icon+'</div><div class="winTitle">'+title+'</div><div class="winSub">'+(r.winner==='D'?'هذه الجولة انتهت بدون فائز.':'أحسنت! اضغط جولة جديدة للعب مرة أخرى.')+'</div><div class="winButtons"><button onclick="closeResult()">إغلاق</button><button class="again" onclick="closeResult();newGame()">🎮 جولة جديدة</button></div></div>';document.body.appendChild(o)}function closeResult(){let x=document.getElementById('winOverlay');if(x)x.remove()}function cycleDifficulty(){let n=levels[(levels.indexOf(difficulty)+1)%3];difficulty=n;diffBtn.textContent='🧠 '+names[n]}render()</script></body></html>
